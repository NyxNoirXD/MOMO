# Local development / Oracle VPS deployment: one container, everything inside.
#   docker compose up -d --build
#   open http://localhost:2785 -> dashboard -> create session "momo" -> scan QR
# Webhook auto-registration needs OPENWA_PUBLIC_URL + WEBHOOK_SECRET (see .env).
services:
  momo:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: momo
    ports:
      - '2785:2785'
    volumes:
      - ./data:/app/data
    environment:
      - ENGINE_TYPE=baileys
      - AUTO_START_SESSIONS=true
      - OPENWA_SESSION_NAME=${OPENWA_SESSION_NAME:-momo}
      - OPENWA_PUBLIC_URL=${OPENWA_PUBLIC_URL:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - BACKUP_REMOTE=${BACKUP_REMOTE:-}
      - RCLONE_CONFIG_B2_TYPE=${RCLONE_CONFIG_B2_TYPE:-}
      - RCLONE_CONFIG_B2_ACCOUNT=${RCLONE_CONFIG_B2_ACCOUNT:-}
      - RCLONE_CONFIG_B2_KEY=${RCLONE_CONFIG_B2_KEY:-}
      - BOT_STATE_TTL_MS=${BOT_STATE_TTL_MS:-600000}
      - GROUP_COMMAND_PREFIXES=${GROUP_COMMAND_PREFIXES:-/!}
      - ADMIN_JIDS=${ADMIN_JIDS:-}
      - ALLOWLIST_ENABLED=${ALLOWLIST_ENABLED:-false}
      - BROADCAST_MAX=${BROADCAST_MAX:-20}
      - RATE_LIMIT_MS=${RATE_LIMIT_MS:-10000}
      - SUB_POLL_MS=${SUB_POLL_MS:-900000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    restart: unless-stopped